# Commands the no-mistakes gate runs in its worktree of tracked files only.
# The worktree has no node_modules, so prepare installs them from the lockfile
# before test runs the full project check.
commands:
  prepare: "pnpm install --frozen-lockfile"
  test: "pnpm check"
# This fork's work merges into code-goblins, not its default branch main, so
# the gate rebases onto, reviews against and opens pull requests to code-goblins.
pr:
  base_branch: code-goblins
